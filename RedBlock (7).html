<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedBlock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#f3ecec;--sf:#ffffff;--ink:#1d1416;--mu:#6e5c60;--rd:#d92b2b;--bl:#2f6bff;--mi:#2fd3a0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--sf:#271a1d;--ink:#fbeff0;--mu:#b9a2a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1214;--sf:#271a1d;--ink:#fbeff0;--mu:#b9a2a6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.5px}
.logo i{display:block;width:30px;height:30px;background:var(--rd);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-8deg)}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--sf);border:3px solid var(--ink);border-radius:10px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible,input:focus-visible,svg [data-p]:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
button.on{background:var(--rd);color:#fff}
button.go{background:var(--mi);color:#151a33}
nav button{display:flex;align-items:center;gap:8px}
nav svg{width:20px;height:24px;flex:none}
h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0 0 8px;letter-spacing:-1px}
p.sub{margin:0 0 20px;color:var(--mu);max-width:46ch}
.panel{background:var(--sf);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.empty{text-align:center;padding:40px 16px}
.empty b{display:block;width:44px;height:44px;margin:0 auto 14px;background:var(--rd);border:3px solid var(--ink);transform:rotate(8deg)}
.empty p{margin:0;color:var(--mu)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input{font:inherit;width:100%;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
#msg{min-height:24px;margin:12px 0 0;font-weight:600;color:var(--rd)}
#msg.ok{color:#1d9b73}
.who{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.who svg{width:90px;height:105px}
.who h2{margin:0;font-size:26px;display:flex;align-items:center;gap:8px}
nav svg.vb{width:18px;height:18px}
.who h2 svg.vb{width:24px;height:24px}
.who p{margin:2px 0 12px;color:var(--mu)}
.av{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px}
@media (max-width:620px){.av{grid-template-columns:1fr}}
.stage{background:var(--bg);border:3px solid var(--ink);border-radius:14px;padding:12px;display:grid;place-items:center}
.stage svg{width:100%;max-width:210px;height:auto}
svg [data-p]{cursor:pointer}
.ctl h3{margin:0 0 8px;font-size:17px}
.ctl section{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:5px 10px;box-shadow:2px 2px 0 var(--ink);font-size:14px}
.chips button.sel{background:var(--ink);color:var(--bg)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.pal button{aspect-ratio:1;padding:0;border-radius:8px;box-shadow:2px 2px 0 var(--ink)}
.pal button.sel{outline:3px solid var(--bl);outline-offset:2px}
.stage{position:relative;gap:10px;align-content:start}
.stage .tag{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:2px 8px;border-radius:6px}
.stage .chips{justify-content:center}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.item{padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:2px 2px 0 var(--ink);background:var(--bg)}
.item span{display:block;width:100%;aspect-ratio:1}
.item span svg{width:100%;height:100%}
.item small{font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.item.sel{outline:3px solid var(--bl);outline-offset:2px}
.sl b{float:right;color:var(--mu)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--sf);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.thumb{height:110px;border-bottom:3px solid var(--ink);background:linear-gradient(#87ceeb 55%,#6f7378 55%);display:grid;place-items:end center}
.thumb b{width:60px;height:12px;background:var(--rd);margin-bottom:12px}
.card .in{padding:12px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:19px}
.card small{color:var(--mu)}
.card button{margin-top:8px}
.gw{position:relative;height:min(72vh,560px);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;touch-action:none;background:#87ceeb}
#cvh{position:absolute;inset:0;touch-action:none}
#cvh canvas{display:block;width:100%;height:100%}
#joy{position:absolute;left:16px;bottom:16px;width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.7);touch-action:none}
#knob{position:absolute;left:30px;top:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none}
#jb{position:absolute;right:16px;bottom:24px;width:76px;height:76px;border-radius:50%;background:var(--rd);color:#fff;touch-action:none;padding:0}
.item{border:3px solid var(--ink);border-radius:10px}
.item button{padding:4px 8px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
button:disabled{opacity:.6;cursor:default}
.coins{margin:0 0 10px}
#mm{min-height:22px;margin:0 0 8px;font-weight:600;color:var(--rd)}
#hud{position:absolute;top:62px;left:10px;background:rgba(0,0,0,.5);color:#fff;font-weight:600;padding:6px 12px;border-radius:10px;pointer-events:none;white-space:pre-line}
.item span{background:#cfd3da;border-radius:6px}
.thumb b{width:38px;height:48px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#fff1c9;border:3px solid var(--ink)}
#tb{position:absolute;right:104px;bottom:24px;width:76px;height:76px;border-radius:50%;background:#ffc933;color:#151a33;touch-action:none;padding:0}
#trb{position:absolute;top:10px;right:10px;padding:6px 12px}
#tpn{position:absolute;top:56px;right:10px;width:230px;background:var(--sf);border:3px solid var(--ink);border-radius:12px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
#prb{position:absolute;top:10px;right:96px;padding:6px 12px}
#ppn{position:absolute;top:56px;right:10px;width:250px;max-height:300px;overflow:auto;background:var(--sf);border:3px solid var(--ink);border-radius:12px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.pr{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.pr small{color:var(--mu);flex:1}
.pr button,#ppn .chips button{padding:2px 8px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.pl{font-weight:700;margin-top:8px}
.r0{color:#888}.r1{color:#4b8bff}.r2{color:#c15bff}.r3{color:#e0a800}
body.ingame header,body.ingame #foot{display:none}
body.ingame .wrap{max-width:none;padding:0}
body.ingame #vg .bar{display:none}
body.ingame .gw{position:fixed;inset:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);height:auto;z-index:50;border:0;border-radius:0;box-shadow:none}
#lv2{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:6px 14px;z-index:6}
#opn{position:absolute;transform:translate(-50%,-50%);z-index:7;padding:10px 22px;font-size:18px;background:#fff;color:#151a33}
#shp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,90%);z-index:8;background:var(--sf);border:3px solid var(--ink);border-radius:14px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh button{padding:2px 10px}
.up{background:var(--bg);border:3px solid var(--ink);border-radius:10px;padding:10px;margin-top:10px}
#rot{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 12px;border-radius:10px;font-weight:600;font-size:14px;z-index:6;white-space:nowrap}
#lv2{display:none}
#mnb{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:50%;padding:0;font-size:26px;line-height:1;z-index:6}
#mnu{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,88%);background:var(--sf);border:3px solid var(--ink);border-radius:14px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.mbox h3{margin:12px 0 6px;font-size:15px}
.mb{display:block;width:100%;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin:0}
#dm{width:46px;height:46px;border-radius:50%;padding:0;font-size:26px;line-height:1}
.sec{margin:22px 0 10px;font-size:22px}
.hello{margin:14px 0 4px}
.hl{font-size:18px;margin-bottom:8px}
.bdg{display:inline-block;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;font-weight:700;font-size:13px;color:#151a33;background:var(--sf)}
.frow{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 12px}
.ft{background:none;border:0;box-shadow:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;font-size:12px;border-radius:12px}
.ft:active{transform:none;box-shadow:none}
.bub{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#cfd3da;border:3px solid var(--ink);display:block;flex:none}
.bub svg{width:100%;height:100%;display:block}
.bub.me{border-color:var(--rd)}
.bub.add{display:grid;place-items:center;font-size:30px;font-weight:700;background:var(--sf)}
.daily{margin-top:12px;background:var(--sf);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:12px}
.dstrip{display:flex;gap:6px;margin:8px 0}
.dd{flex:1;text-align:center;border:3px solid var(--ink);border-radius:8px;padding:4px 0;font-size:12px;font-weight:700;background:var(--bg)}
.dd.got{background:var(--mi);color:#151a33}
.dd.now{background:#ffc933;color:#151a33}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow:auto}
.mdl{margin:5vh auto;width:92%;max-width:460px;background:var(--sf);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.mdl h2{margin:0;display:flex;align-items:center;gap:6px}
.mdl h2 svg.vb{width:24px;height:24px}
.mdl h3{margin:14px 0 6px;font-size:15px}
.mu{color:var(--mu)}
.pftop{display:flex;gap:14px;align-items:center}
.pfav{width:110px;flex:none;background:#cfd3da;border:3px solid var(--ink);border-radius:12px;padding:4px}
.pfav svg{width:100%;height:auto;display:block}
.pfc{display:flex;gap:14px;margin-top:8px}
.pfc div{text-align:center}
.pfc b{display:block;font-size:18px}
.pfc small{color:var(--mu)}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fr{display:flex;align-items:center;gap:10px;margin:8px 0}
.fr .bub{width:48px;height:48px}
.fn{flex:1;display:flex;flex-direction:column;line-height:1.2;cursor:pointer}
.fn small{color:var(--mu)}
.dng{background:var(--rd);color:#fff}
.smsg{min-height:20px;margin:6px 0 0;font-weight:600;color:var(--rd)}
.smsg.ok{color:#1d9b73}
.st{margin-bottom:16px}
.st h3{margin:0 0 6px}
textarea{font:inherit;width:100%;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
#ixb{position:absolute;top:10px;right:170px;padding:6px 12px}
#ixp,#adp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94%);max-height:86%;overflow:auto;z-index:12;background:var(--sf);border:3px solid var(--ink);border-radius:14px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.ixg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ixc{border:3px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.ixi{width:96px;height:96px;margin:0 auto 4px;background:#cfd3da;border-radius:10px;overflow:hidden}
.ixi img{width:100%;height:100%;display:block}
.ixc.unk .ixi img{filter:brightness(0)}
.ixc small{color:var(--mu);font-size:12px}
.ar{display:flex;gap:8px}
.ar input,.ar select{flex:1;min-width:0}
select{font:inherit;padding:8px;border:3px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
.hide{display:none}
.note{color:var(--mu);font-size:14px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i></i>RedBlock</div>
  <nav>
    <button id="nj" class="on">Discover</button>
    <button id="nv">Avatar</button>
    <button id="na">Log in</button>
  </nav>
</header>

<section id="vj">

  <h2 class="sec">Games</h2>

</section>

<section id="va" class="hide"></section>

<section id="vg" class="hide"><div class="bar"><button id="lv">Leave</button><span>Drag to look around. Stand on the raised pad, then throw with E or the Throw button.</span></div><div class="gw"><div id="cvh"></div><div id="hud"></div><button id="ixb">Index</button><button id="prb">Pets</button><button id="trb">Train</button><div id="tpn" class="hide"></div><div id="ppn" class="hide"></div><div id="ixp" class="hide"></div><div id="adp" class="hide"></div><button id="lv2">Leave</button><button id="opn" class="hide">Open</button><div id="shp" class="hide"></div><div id="rot" class="hide">Rotate your phone to landscape</div><button id="mnb" aria-label="Menu">&#8943;</button><div id="mnu" class="hide"></div><div id="joy"><i id="knob"></i></div><button id="jb">Jump</button><button id="tb" class="hide">Throw</button></div></section>

<section id="vv" class="hide"></section>

<p class="note" id="foot"></p>
</div>

<div id="mod" class="hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function toHex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function hashPw(salt,pw){
  var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));
  return toHex(b);
}
function newSalt(){var a=new Uint8Array(12);crypto.getRandomValues(a);return toHex(a)}
function say(t,ok){var m=$("msg");if(m){m.textContent=t;m.className=ok?"ok":""}}

  +'<label for="u">Username</label><input id="u" maxlength="16" autocomplete="username" autocapitalize="off">'

  $("tm").onclick=function(){mode="masuk";drawAuth()};

async function submit(){
  var name=$("u").value.trim(),pw=$("p").value,key=name.toLowerCase(),us=users();
  if(!window.crypto||!crypto.subtle){say("This browser does not support secure password storage.");return}
  try{
    if(mode==="daftar"){
      if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){say("Username must be 3 to 16 characters: letters, numbers or underscore.");return}
      if(key==="owner"){say("This username is reserved for a system account.");return}
      if(pw.length<6){say("Password must be at least 6 characters.");return}
      if(pw!==$("p2").value){say("Passwords do not match.");return}
      if(us[key]){say("Username is already taken. Try another one.");return}
      var s=newSalt();
      us[key]={name:name,salt:s,hash:await hashPw(s,pw),avatar:clean(null),created:Date.now(),coins:500,owned:[]};
      saveUsers(us);
    }else{
      if(key==="owner"){
        if(await hashPw(OWNER_SALT,pw)!==OWNER_HASH){say("Wrong username or password.");return}
        if(!us.owner){us.owner={name:"Owner",avatar:clean(null),created:Date.now()};saveUsers(us)}
      }else{
        var u=us[key];
        if(!u||!u.hash||u.hash!==await hashPw(u.salt,pw)){say("Wrong username or password.");return}
      }
    }
    lsSet("rb_session",key);
    login(key);show(mode==="daftar"?"v":"j");
  }catch(e){say("Something went wrong. Please try again.")}
}
function login(key){
  var u=users()[key];
  if(!u){cur=null;return}
  cur={key:key,name:u.disp||u.name,avatar:clean(u.avatar),created:u.created,coins:(typeof u.coins==="number"?u.coins:500),owned:(Array.isArray(u.owned)?u.owned.slice():ownedFrom(u.avatar)),game:ng(u.game)};
  for(var s in cur.avatar.items)if(!own(s,cur.avatar.items[s]))cur.avatar.items[s]="none";
  header();
}

function fmtWait(ms){var m=Math.max(1,Math.ceil(ms/6e4));return Math.floor(m/60)+"h "+m%60+"m"}
function dailyAmt(n){return 50+25*(n-1)}
function dailyInfo(){var u=users()[cur.key]||{},d=u.daily||{t:0,s:0},el=Date.now()-d.t,can=!d.t||el>=864e5,st=(d.t&&el<1728e5)?d.s:0;if(can&&st>=7)st=0;return{can:can,st:st,next:st+1,wait:864e5-el}}
function drawHome(){
  var hm=$("hm");if(!hm||!cur)return;
  var us=users(),u=us[cur.key]||{},fr=frs(u).filter(function(k){return us[k]}),rq=(u.req||[]).filter(function(k){return us[k]}),g=cur.game,di=dailyInfo();
  var h='<div class="hello"><div class="hl">Welcome back, <b>'+esc(cur.name)+'</b>!</div><div class="chips"><span class="bdg">RB: '+(isOwner()?"INF":cur.coins)+'</span><span class="bdg">Power Lv '+g.lvl+'</span><span class="bdg">Cash: '+(isOwner()?"INF":"$"+fmt(g.cash))+'</span></div></div>';
  h+='<h2 class="sec">Friends</h2><div class="frow"><button class="ft" id="fme">'+bubble(cur.key,"me")+'<small>Profile</small></button><button class="ft" id="fad"><span class="bub add">+</span><small>Add friend</small></button>';
  if(rq.length)h+='<button class="ft" id="frq"><span class="bub add">'+rq.length+'</span><small>Requests</small></button>';
  fr.forEach(function(k){h+='<button class="ft" data-fk="'+esc(k)+'">'+bubble(k)+'<small>'+esc(us[k].disp||us[k].name)+'</small></button>'});
  h+='</div>';
  if(!isOwner()){
    h+='<div class="daily"><b>Daily reward</b><div class="dstrip">';
    for(var i=1;i<=7;i++)h+='<span class="dd'+(i<=di.st?" got":(di.can&&i===di.next?" now":""))+'">'+dailyAmt(i)+'</span>';
    h+='</div><button id="dc" class="go"'+(di.can?"":" disabled")+'>'+(di.can?"Claim +"+dailyAmt(di.next)+" RB":"Next reward in "+fmtWait(di.wait))+'</button></div>';
  }
  hm.innerHTML=h;
  $("fme").onclick=function(){profileMod(cur.key)};
  $("fad").onclick=function(){addMod("")};
  if($("frq"))$("frq").onclick=reqMod;
  hm.querySelectorAll("[data-fk]").forEach(function(b){b.onclick=function(){profileMod(b.dataset.fk)}});
  if($("dc"))$("dc").onclick=function(){var d=dailyInfo();if(!d.can)return;cur.coins+=dailyAmt(d.next);saveAv();mutate(function(us2){us2[cur.key].daily={t:Date.now(),s:d.next}});header();drawHome()};
}
/* Settings (replaces the old account page) */
function sm(id,t,ok){var e=$(id);if(e){e.textContent=t;e.className="smsg"+(ok?" ok":"")}}
async function chkPw(pw){var u=users()[cur.key];return !!u&&!!u.hash&&(await hashPw(u.salt,pw))===u.hash}
function drawSettings(){
  var el=$("va"),u=users()[cur.key]||{},ow=isOwner(),th=lsGet("rb_theme")||"system",pv=u.priv||"all";
  el.innerHTML='<h1>Settings</h1>'
  +'<div class="panel st"><h3>Profile</h3><label for="s1">Display name</label><input id="s1" maxlength="20"><label for="s2">About</label><textarea id="s2" maxlength="160" rows="3" placeholder="Tell people about yourself"></textarea><p style="margin:12px 0 0"><button class="go" id="sp">Save profile</button></p><p class="smsg" id="m1"></p></div>'
  +'<div class="panel st"><h3>Account info</h3>'+(ow?'<p class="note" style="margin:0">Owner is a system account. Username, email and password cannot be changed.</p>':'<label for="s3">New username</label><input id="s3" maxlength="16" autocapitalize="off"><label for="s4">Current password</label><input id="s4" type="password" autocomplete="current-password"><p style="margin:12px 0 0"><button id="su">Change username</button></p><p class="smsg" id="m2"></p><label for="s5">Email</label><input id="s5" type="email" placeholder="you@example.com"><p style="margin:12px 0 0"><button id="se">Save email</button></p><p class="smsg" id="m3"></p>')+'</div>'
  +(ow?'':'<div class="panel st"><h3>Security</h3><label for="s6">Current password</label><input id="s6" type="password" autocomplete="current-password"><label for="s7">New password</label><input id="s7" type="password" autocomplete="new-password"><label for="s8">Confirm new password</label><input id="s8" type="password" autocomplete="new-password"><p style="margin:12px 0 0"><button id="sw">Change password</button></p><p class="smsg" id="m4"></p></div>')
  +'<div class="panel st"><h3>Privacy</h3><p class="mu" style="margin:0 0 8px">Who can send you friend requests</p><div class="chips"><button data-pv="all" class="'+(pv==="all"?"sel":"")+'">Everyone</button><button data-pv="none" class="'+(pv==="none"?"sel":"")+'">No one</button></div></div>'
  +'<div class="panel st"><h3>Appearance</h3><div class="chips">'+[["system","System"],["light","Light"],["dark","Dark"]].map(function(t){return '<button data-th="'+t[0]+'" class="'+(th===t[0]?"sel":"")+'">'+t[1]+'</button>'}).join("")+'</div></div>'
  +'<p class="note">Accounts are saved in this browser only. Logging in from other devices needs a RedBlock server. To log out, open the menu on the Discover page.</p>';
  $("s1").value=u.disp||u.name||"";$("s2").value=u.bio||"";
  $("sp").onclick=function(){
    var dn=$("s1").value.trim(),bio=$("s2").value.trim();
    if(!/^[A-Za-z0-9 _]{3,20}$/.test(dn)){sm("m1","Display name: 3 to 20 characters (letters, numbers, spaces, underscore).");return}
    mutate(function(us){us[cur.key].disp=dn;us[cur.key].bio=bio});cur.name=dn;header();sm("m1","Profile saved.",1);
  };
  if(!ow){
    $("s5").value=u.email||"";
    $("su").onclick=async function(){
      var nn=$("s3").value.trim(),pw=$("s4").value,key=nn.toLowerCase(),old=cur.key;
      if(!/^[A-Za-z0-9_]{3,16}$/.test(nn)){sm("m2","Username must be 3 to 16 characters: letters, numbers or underscore.");return}
      if(key==="owner"){sm("m2","This username is reserved for a system account.");return}
      if(key!==old&&users()[key]){sm("m2","Username is already taken.");return}
      if(!(await chkPw(pw))){sm("m2","Wrong password.");return}
      mutate(function(us){var rec=us[old];rec.name=nn;if(key!==old){us[key]=rec;delete us[old];for(var k in us){["friends","req","sent"].forEach(function(f){if(Array.isArray(us[k][f]))us[k][f]=us[k][f].map(function(x){return x===old?key:x})})}}});
      lsSet("rb_session",key);cur.key=key;var r=users()[key];cur.name=r.disp||r.name;header();$("s3").value="";$("s4").value="";sm("m2","Username changed to "+nn+".",1);
    };
    $("se").onclick=function(){
      var v=$("s5").value.trim().toLowerCase();
      if(v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){sm("m3","Enter a valid email address.");return}
      mutate(function(us){us[cur.key].email=v});sm("m3",v?"Email saved. It is not verified yet because RedBlock has no mail server.":"Email removed.",1);
    };
    $("sw").onclick=async function(){
      var o=$("s6").value,n=$("s7").value,c=$("s8").value;
      if(n.length<6){sm("m4","New password must be at least 6 characters.");return}
      if(n!==c){sm("m4","Passwords do not match.");return}
      if(!(await chkPw(o))){sm("m4","Current password is wrong.");return}
      var sa=newSalt(),hh=await hashPw(sa,n);
      mutate(function(us){us[cur.key].salt=sa;us[cur.key].hash=hh});$("s6").value="";$("s7").value="";$("s8").value="";sm("m4","Password changed.",1);
    };
  }
  el.querySelectorAll("[data-pv]").forEach(function(b){b.onclick=function(){mutate(function(us){us[cur.key].priv=b.dataset.pv});drawSettings()}});
  el.querySelectorAll("[data-th]").forEach(function(b){b.onclick=function(){lsSet("rb_theme",b.dataset.th);applyTheme(b.dataset.th);drawSettings()}});
}
$("dm").onclick=dmenu;

/* Mulai */
(function(){ensureOwner();applyTheme(lsGet("rb_theme")||"system");var k=lsGet("rb_session");if(k)login(k);header();show(cur?"j":"a")})();
</script>
</body>
</html>
