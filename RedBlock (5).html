<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedBlock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#f3ecec;--sf:#ffffff;--ink:#1d1416;--mu:#6e5c60;--rd:#d92b2b;--bl:#2f6bff;--mi:#2fd3a0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--sf:#271a1d;--ink:#fbeff0;--mu:#b9a2a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1214;--sf:#271a1d;--ink:#fbeff0;--mu:#b9a2a6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.5px}
.logo i{display:block;width:30px;height:30px;background:var(--rd);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-8deg)}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--sf);border:3px solid var(--ink);border-radius:10px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:none}
button:focus-visible,input:focus-visible,svg [data-p]:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
button.on{background:var(--rd);color:#fff}
button.go{background:var(--mi);color:#151a33}
nav button{display:flex;align-items:center;gap:8px}
nav svg{width:20px;height:24px;flex:none}
h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0 0 8px;letter-spacing:-1px}
p.sub{margin:0 0 20px;color:var(--mu);max-width:46ch}
.panel{background:var(--sf);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.empty{text-align:center;padding:40px 16px}
.empty b{display:block;width:44px;height:44px;margin:0 auto 14px;background:var(--rd);border:3px solid var(--ink);transform:rotate(8deg)}
.empty p{margin:0;color:var(--mu)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input{font:inherit;width:100%;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
#msg{min-height:24px;margin:12px 0 0;font-weight:600;color:var(--rd)}
#msg.ok{color:#1d9b73}
.who{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.who svg{width:90px;height:105px}
.who h2{margin:0;font-size:26px;display:flex;align-items:center;gap:8px}
nav svg.vb{width:18px;height:18px}
.who h2 svg.vb{width:24px;height:24px}
.who p{margin:2px 0 12px;color:var(--mu)}
.av{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px}
@media (max-width:620px){.av{grid-template-columns:1fr}}
.stage{background:var(--bg);border:3px solid var(--ink);border-radius:14px;padding:12px;display:grid;place-items:center}
.stage svg{width:100%;max-width:210px;height:auto}
svg [data-p]{cursor:pointer}
.ctl h3{margin:0 0 8px;font-size:17px}
.ctl section{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:5px 10px;box-shadow:2px 2px 0 var(--ink);font-size:14px}
.chips button.sel{background:var(--ink);color:var(--bg)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.pal button{aspect-ratio:1;padding:0;border-radius:8px;box-shadow:2px 2px 0 var(--ink)}
.pal button.sel{outline:3px solid var(--bl);outline-offset:2px}
.stage{position:relative;gap:10px;align-content:start}
.stage .tag{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:2px 8px;border-radius:6px}
.stage .chips{justify-content:center}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.item{padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:2px 2px 0 var(--ink);background:var(--bg)}
.item span{display:block;width:100%;aspect-ratio:1}
.item span svg{width:100%;height:100%}
.item small{font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.item.sel{outline:3px solid var(--bl);outline-offset:2px}
.sl b{float:right;color:var(--mu)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--sf);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.thumb{height:110px;border-bottom:3px solid var(--ink);background:linear-gradient(#87ceeb 55%,#6f7378 55%);display:grid;place-items:end center}
.thumb b{width:60px;height:12px;background:var(--rd);margin-bottom:12px}
.card .in{padding:12px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:19px}
.card small{color:var(--mu)}
.card button{margin-top:8px}
.gw{position:relative;height:min(72vh,560px);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;touch-action:none;background:#87ceeb}
#cvh{position:absolute;inset:0;touch-action:none}
#cvh canvas{display:block;width:100%;height:100%}
#joy{position:absolute;left:16px;bottom:16px;width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.7);touch-action:none}
#knob{position:absolute;left:30px;top:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none}
#jb{position:absolute;right:16px;bottom:24px;width:76px;height:76px;border-radius:50%;background:var(--rd);color:#fff;touch-action:none;padding:0}
.item{border:3px solid var(--ink);border-radius:10px}
.item button{padding:4px 8px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
button:disabled{opacity:.6;cursor:default}
.coins{margin:0 0 10px}
#mm{min-height:22px;margin:0 0 8px;font-weight:600;color:var(--rd)}
#hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;font-weight:600;padding:6px 12px;border-radius:10px;pointer-events:none;white-space:pre-line}
.item span{background:#cfd3da;border-radius:6px}
.thumb b{width:38px;height:48px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#fff1c9;border:3px solid var(--ink)}
#tb{position:absolute;right:104px;bottom:24px;width:76px;height:76px;border-radius:50%;background:#ffc933;color:#151a33;touch-action:none;padding:0}
#trb{position:absolute;top:10px;right:10px;padding:6px 12px}
#tpn{position:absolute;top:56px;right:10px;width:230px;background:var(--sf);border:3px solid var(--ink);border-radius:12px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
#prb{position:absolute;top:10px;right:96px;padding:6px 12px}
#ppn{position:absolute;top:56px;right:10px;width:250px;max-height:300px;overflow:auto;background:var(--sf);border:3px solid var(--ink);border-radius:12px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.pr{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.pr small{color:var(--mu);flex:1}
.pr button,#ppn .chips button{padding:2px 8px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.pl{font-weight:700;margin-top:8px}
.r0{color:#888}.r1{color:#4b8bff}.r2{color:#c15bff}.r3{color:#e0a800}
.hide{display:none}
.note{color:var(--mu);font-size:14px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i></i>RedBlock</div>
  <nav>
    <button id="nj" class="on">Discover</button>
    <button id="nv">Avatar</button>
    <button id="na">Log in</button>
  </nav>
</header>

<section id="vj">
  <h1>Discover games.</h1>
  <p class="sub">Pick a game and play in your browser with the avatar you made.</p>
  <div class="grid"><div class="card"><div class="thumb"><b></b></div><div class="in"><h3>Throw Eggs for Animals</h3><small>By RedBlock, training, plots and 5 zones</small><button class="go" id="ph">Play</button></div></div></div>
</section>

<section id="va" class="hide"></section>

<section id="vg" class="hide"><div class="bar"><button id="lv">Leave</button><span>Drag to look around. Stand on the raised pad, then throw with E or the Throw button.</span></div><div class="gw"><div id="cvh"></div><div id="hud"></div><button id="prb">Pets</button><button id="trb">Train</button><div id="tpn" class="hide"></div><div id="ppn" class="hide"></div><div id="joy"><i id="knob"></i></div><button id="jb">Jump</button><button id="tb">Throw</button></div></section>

<section id="vv" class="hide"></section>

<p class="note" id="foot"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var PAL=["#f5cd30","#ffcc99","#e0ac69","#8d5524","#c4281c","#da8541","#4b974b","#0d69ac","#9fc3e9","#6b327c","#ff9ecb","#f2f3f3","#a3a2a5","#1b2a35","#7c5c46","#e8bb9b"];
var PARTS=[["head","Head"],["torso","Torso"],["la","Left arm"],["ra","Right arm"],["ll","Left leg"],["rl","Right leg"]];
var R={head:[74,18,52,44,10],torso:[60,62,80,80,2],la:[20,62,40,80,2],ra:[140,62,40,80,2],ll:[60,142,40,80,2],rl:[100,142,40,80,2]};
var mem={},cur=null,sel="head",mode="masuk",view="j";
var OWNER_SALT="redblock-owner-v1",OWNER_HASH="3d56afbebdad3a0b0e9ffe4abd909f515e0689b7f69a56631ac815b64ff5f53a";
var BADGE='<svg class="vb" viewBox="0 0 24 24" role="img" aria-label="Verified"><title>Verified</title><path d="M12 1.5l2.4 1.7 2.9-.2 1.2 2.7 2.6 1.3-.3 2.9L22 12l-1.2 2.1.3 2.9-2.6 1.3-1.2 2.7-2.9-.2L12 22.5l-2.4-1.7-2.9.2-1.2-2.7-2.6-1.3.3-2.9L2 12l1.2-2.1-.3-2.9 2.6-1.3 1.2-2.7 2.9.2z" fill="#2f6bff"/><path d="M7.5 12.3l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* Penyimpanan (per browser) */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function users(){try{return JSON.parse(lsGet("rb_users")||"{}")}catch(e){return {}}}
function saveUsers(u){lsSet("rb_users",JSON.stringify(u))}

/* Avatar R6 */
var FACES=[["smile","Smile"],["cool","Cool"],["angry","Angry"],["wow","Surprised"],["wink","Wink"],["sleepy","Sleepy"]];
var DEF={head:"#f5cd30",torso:"#0d69ac",la:"#f5cd30",ra:"#f5cd30",ll:"#4b974b",rl:"#4b974b",face:"smile",w:100,h:100,items:{},cols:{}};
var SKIN=["#f5cd30","#ffcc99","#e8bb9b","#e0ac69","#8d5524","#5a3825","#f2f3f3","#9fc3e9"];
var CAT={
  shirt:{n:"Shirt",c:"#c4281c",v:"torso",o:[["none","No shirt"],["polos","Plain tee"],["garis","Striped tee"],["hoodie","Hoodie"],["logo","RedBlock tee"]]},
  pants:{n:"Pants",c:"#0d69ac",v:"legs",o:[["none","No pants"],["jeans","Jeans"],["pendek","Shorts"],["training","Track pants"]]},
  hair:{n:"Hair",c:"#1b2a35",v:"head",o:[["none","No hair"],["pendek","Short"],["panjang","Long"],["spiky","Spiky"],["cepol","Bun"]]},
  hat:{n:"Hat",c:"#d92b2b",v:"head",o:[["none","No hat"],["cap","Cap"],["party","Party hat"],["crown","Crown"],["helm","Helmet"],["tinggi","Top hat"]]},
  faceAcc:{n:"Face",c:"#1b2a35",v:"head",o:[["none","None"],["kacamata","Glasses"],["shades","Sunglasses"],["masker","Mask"]]},
  neck:{n:"Neck",c:"#da8541",v:"torso",o:[["none","None"],["syal","Scarf"],["dasi","Tie"],["kalung","Necklace"]]},
  back:{n:"Back",c:"#6b327c",v:"back",o:[["none","None"],["sayap","Wings"],["ransel","Backpack"],["jubah","Cape"]]}
};
var TABS={badan:["Body"],pakaian:["Clothing",["shirt","pants"]],aksesori:["Accessories",["hair","hat","faceAcc","neck","back"]],market:["Marketplace"]};
var K='stroke="#1d1416" stroke-width="3"';
function okHex(c){return typeof c==="string"&&/^#[0-9a-f]{6}$/i.test(c)}
function clean(a){
  var o={items:{},cols:{}};
  for(var k in DEF)if(k!=="items"&&k!=="cols")o[k]=DEF[k];
  if(a&&typeof a==="object"){
    PARTS.forEach(function(p){if(okHex(a[p[0]]))o[p[0]]=a[p[0]]});
    if(FACES.some(function(f){return f[0]===a.face}))o.face=a.face;
    ["w","h"].forEach(function(k){var n=+a[k];if(n>=80&&n<=110)o[k]=Math.round(n)});
    for(var s in CAT){
      var id=a.items&&a.items[s];
      if(CAT[s].o.some(function(x){return x[0]===id}))o.items[s]=id;
      if(a.cols&&okHex(a.cols[s]))o.cols[s]=a.cols[s];
    }
  }
  return o;
}
function lum(h){var n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*((n>>8)&255)+.114*(n&255)}
function box(k,f,h){var g=R[k];return '<rect x="'+g[0]+'" y="'+g[1]+'" width="'+g[2]+'" height="'+(h||g[3])+'" rx="'+g[4]+'" fill="'+f+'" '+K+'/>'}
function face(a){
  var c=lum(a.head)<90?"#ffffff":"#1d1416",s='stroke="'+c+'" stroke-width="3" stroke-linecap="round" fill="none"';
  var E='<circle cx="90" cy="38" r="3.5" fill="'+c+'"/><circle cx="110" cy="38" r="3.5" fill="'+c+'"/>',f=a.face;
  if(f==="cool")return '<rect x="82" y="33" width="36" height="9" rx="2" fill="#1d1416"/><path d="M90 52 Q100 57 110 52" '+s+'/>';
  if(f==="angry")return E+'<path d="M84 29 L96 34 M116 29 L104 34" '+s+'/><path d="M90 53 Q100 46 110 53" '+s+'/>';
  if(f==="wow")return E+'<ellipse cx="100" cy="51" rx="5" ry="6" fill="'+c+'"/>';
  if(f==="wink")return '<circle cx="90" cy="38" r="3.5" fill="'+c+'"/><path d="M104 38 L116 38" '+s+'/><path d="M88 48 Q100 58 112 48" '+s+'/>';
  if(f==="sleepy")return '<path d="M84 38 L96 38 M104 38 L116 38" '+s+'/><path d="M94 51 L106 51" '+s+'/>';
  return E+'<path d="M88 48 Q100 58 112 48" '+s+'/>';
}
function shirt(id,c){
  var h=box("torso",c)+box("la",c,62)+box("ra",c,62);
  if(id==="garis")h+='<rect x="60" y="78" width="80" height="9" fill="#fff" opacity=".5"/><rect x="60" y="97" width="80" height="9" fill="#fff" opacity=".5"/><rect x="60" y="116" width="80" height="9" fill="#fff" opacity=".5"/>';
  if(id==="hoodie")h+='<rect x="76" y="116" width="48" height="20" rx="3" fill="#000" opacity=".2"/><path d="M92 64 L92 84 M108 64 L108 84" stroke="#fff" stroke-width="3" opacity=".8"/>';
  if(id==="logo")h+='<rect x="88" y="84" width="24" height="24" fill="#d92b2b" '+K+'/>';
  return h;
}
function pants(id,c){
  var h=box("ll",c,id==="pendek"?40:80)+box("rl",c,id==="pendek"?40:80);
  if(id==="training")h+='<rect x="63" y="145" width="5" height="74" fill="#fff" opacity=".6"/><rect x="132" y="145" width="5" height="74" fill="#fff" opacity=".6"/>';
  return h;
}
function hair(id,c){
  var f='fill="'+c+'" '+K,h="";

  return '<rect x="60" y="60" width="80" height="13" rx="4" '+f+'/><rect x="108" y="66" width="16" height="32" rx="3" '+f+'/>';
}
function back(id,c){
  var f='fill="'+c+'" '+K;
  if(id==="sayap")return '<path d="M60 72 C34 38 2 38 -6 68 C4 74 4 86 -4 96 C8 98 10 108 2 118 C26 116 44 110 60 106 Z" '+f+'/><path transform="matrix(-1 0 0 1 200 0)" d="M60 72 C34 38 2 38 -6 68 C4 74 4 86 -4 96 C8 98 10 108 2 118 C26 116 44 110 60 106 Z" '+f+'/>';
  if(id==="ransel")return '<rect x="52" y="72" width="96" height="62" rx="6" '+f+'/>';
  return '<rect x="54" y="62" width="92" height="130" rx="4" '+f+'/>';
}
var ART={shirt:shirt,pants:pants,hair:hair,hat:hat,faceAcc:facc,neck:neck,back:back};
function avSVG(a,live,vb){
  a=clean(a);
  function L(s){var id=a.items[s];return id&&id!=="none"?ART[s](id,a.cols[s]||CAT[s].c):""}
  var h='<svg viewBox="'+(vb||"-10 -26 220 258")+'" xmlns="http://www.w3.org/2000/svg" aria-label="Avatar R6"><g transform="translate(100 222) scale('+a.w/100+' '+a.h/100+') translate(-100 -222)">';
  h+=L("back");
  PARTS.forEach(function(p){
    var g=R[p[0]];
    h+='<rect '+(live?'data-p="'+p[0]+'" tabindex="0" role="button" aria-label="'+p[1]+'" ':'')+'x="'+g[0]+'" y="'+g[1]+'" width="'+g[2]+'" height="'+g[3]+'" rx="'+g[4]+'" fill="'+a[p[0]]+'" '+K+'/>';
  });
  h+='<g pointer-events="none">'+L("pants")+L("shirt")+L("neck")+face(a)+L("faceAcc")+L("hair")+L("hat")+'</g>';
  if(live){var g=R[sel];h+='<rect x="'+(g[0]-3)+'" y="'+(g[1]-3)+'" width="'+(g[2]+6)+'" height="'+(g[3]+6)+'" rx="'+(g[4]+3)+'" fill="none" stroke="#2f6bff" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>'}
  return h+'</g></svg>';
}

/* Navigasi */
function show(k){
  if(!cur)k="a";
  view=k;
  $("vj").classList.toggle("hide",k!=="j");
  $("va").classList.toggle("hide",k!=="a");
  $("vv").classList.toggle("hide",k!=="v");
  $("vg").classList.toggle("hide",k!=="g");
  $("nj").classList.toggle("on",k==="j");
  $("nv").classList.toggle("on",k==="v");
  $("na").classList.toggle("on",k==="a");
  if(k==="a")drawAuth();
  if(k==="v")drawAvatar();

async function submit(){
  var name=$("u").value.trim(),pw=$("p").value,key=name.toLowerCase(),us=users();
  if(!window.crypto||!crypto.subtle){say("This browser does not support secure password storage.");return}
  try{
    if(mode==="daftar"){
      if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){say("Username must be 3 to 16 characters: letters, numbers or underscore.");return}
      if(key==="owner"){say("This username is reserved for a system account.");return}
      if(pw.length<6){say("Password must be at least 6 characters.");return}
      if(pw!==$("p2").value){say("Passwords do not match.");return}
      if(us[key]){say("Username is already taken. Try another one.");return}
      var s=newSalt();
      us[key]={name:name,salt:s,hash:await hashPw(s,pw),avatar:clean(null),created:Date.now(),coins:500,owned:[]};
      saveUsers(us);
    }else{
      if(key==="owner"){
        if(await hashPw(OWNER_SALT,pw)!==OWNER_HASH){say("Wrong username or password.");return}
        if(!us.owner){us.owner={name:"Owner",avatar:clean(null),created:Date.now()};saveUsers(us)}
      }else{
        var u=us[key];
        if(!u||!u.hash||u.hash!==await hashPw(u.salt,pw)){say("Wrong username or password.");return}
      }
    }
    lsSet("rb_session",key);
    login(key);show(mode==="daftar"?"v":"j");
  }catch(e){say("Something went wrong. Please try again.")}
}

  for(var s in cur.avatar.items)if(!own(s,cur.avatar.items[s]))cur.avatar.items[s]="none";
  header();
}
